<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Unrot — Android focus app">
<defs><clipPath id="c"><rect width="400" height="300" rx="16"/></clipPath>
<filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}.s{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.r{transform-origin:350px 60px;animation:sp 12s linear infinite reverse}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.r{animation:none}}</style></defs>
<g clip-path="url(#c)">
<rect width="400" height="300" fill="#0b0e14"/>
<rect width="400" height="2" fill="#f5c518" opacity=".35"><animate attributeName="y" values="0;300" dur="4.5s" begin="1s" repeatCount="indefinite"/></rect>
<g class="r" filter="url(#g)"><circle cx="350" cy="60" r="26" fill="none" stroke="#f5c518" stroke-width="5" stroke-dasharray="12 7"/></g>
<circle cx="350" cy="60" r="9" fill="#f5c518"><animate attributeName="opacity" values="1;.3;1" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
<text class="m" x="26" y="40" font-size="13" fill="#f5c518" letter-spacing="3">SCHEMATIC 02</text>
<text class="s" x="26" y="92" font-size="40" font-weight="800" fill="#f1f5f9">Unrot</text>
<text class="m" x="26" y="122" font-size="15" fill="#4dd0ff">Android focus system</text>
<text class="s" x="26" y="162" font-size="17" fill="#a8b3c4">Locks distracting apps behind</text>
<text class="s" x="26" y="186" font-size="17" fill="#a8b3c4">a timer; earn time back with math</text>
<text class="m" x="26" y="224" font-size="14" fill="#e2e8f0">Android · Product Design</text>
<rect x="26" y="244" width="348" height="1" fill="#f5c518" opacity=".4"/>
<text class="m" x="26" y="272" font-size="14" fill="#f5c518" letter-spacing="2">◆ ANDROID BUILD</text>
<g fill="none" stroke="#f5c518" stroke-width="2"><path d="M8 24V8h16"/><path d="M376 8h16v16"/><path d="M8 276v16h16"/><path d="M376 292h16v-16"/></g>
</g>
<rect x=".5" y=".5" width="399" height="299" rx="16" fill="none" stroke="#f5c518" stroke-opacity=".4"/>
</svg>
