<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="Md Mahfujur Rahman Sujel — BSc in CSE at East West University">
<defs>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#e62429"/><stop offset="1" stop-color="#f5c518"/></linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#8be9ff"/><stop offset="1" stop-color="#1aa7d8" stop-opacity=".2"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f5c518" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="1280" height="440" rx="20"/></clipPath>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
.rot1{transform-origin:1050px 225px;animation:spin 18s linear infinite}
.rot2{transform-origin:1050px 225px;animation:spin 28s linear infinite reverse}
.rot3{transform-origin:1050px 225px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rot1,.rot2,.rot3{animation:none}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="440" fill="#07090d"/>
<rect width="1280" height="440" fill="url(#grid)"/>
<circle cx="1050" cy="225" r="260" fill="#1aa7d8" opacity=".07"><animate attributeName="opacity" values=".04;.1;.04" dur="4s" repeatCount="indefinite"/></circle>
<rect x="0" y="0" width="1280" height="3" fill="#f5c518" opacity=".18"><animate attributeName="y" values="-10;440" dur="6s" repeatCount="indefinite"/></rect>

<text class="m" x="50" y="52" font-size="13" fill="#f5c518" letter-spacing="3">J.A.R.V.I.S // PROFILE BOOT SEQUENCE</text>
<circle cx="1180" cy="47" r="5" fill="#e62429"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="1202" cy="47" r="5" fill="#f5c518"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
<circle cx="1224" cy="47" r="5" fill="#4dd0ff"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
<rect x="50" y="66" width="1180" height="1" fill="#f5c518" opacity=".25"/>

<g class="m" font-size="14" fill="#7dd3fc">
<text x="50" y="100" opacity="0">&gt; initializing profile ........ OK<animate attributeName="opacity" from="0" to="1" dur=".4s" begin=".3s" fill="freeze"/></text>
<text x="50" y="122" opacity="0">&gt; loading modules: React · Java · Spring Boot · Android ........ OK<animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1s" fill="freeze"/></text>
<text x="50" y="144" opacity="0">&gt; user authenticated<animate attributeName="opacity" from="0" to="1" dur=".4s" begin="1.7s" fill="freeze"/></text>
</g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".8s" begin="2.2s" fill="freeze"/>
<text class="m" x="50" y="215" font-size="52" font-weight="800" fill="url(#nm)" filter="url(#glow)">MD MAHFUJUR RAHMAN SUJEL</text>
<text class="m" x="50" y="256" font-size="21" fill="#e5e7eb">BSc in Computer Science &amp; Engineering</text>
<text class="m" x="50" y="284" font-size="21" fill="#f5c518">East West University</text>
</g>

<clipPath id="t0"><rect x="50" y="326" height="34" width="0"><animate attributeName="width" values="0;650;650;0" keyTimes="0;.133;.3;.333" dur="12s" begin="3s" repeatCount="indefinite"/></rect></clipPath>
<text class="m" x="50" y="350" font-size="22" fill="#4dd0ff" clip-path="url(#t0)">&gt; Software engineering · UI/UX · product building</text>
<clipPath id="t1"><rect x="50" y="326" height="34" width="0"><animate attributeName="width" values="0;640;640;0" keyTimes="0;.133;.3;.333" dur="12s" begin="7s" repeatCount="indefinite"/></rect></clipPath>
<text class="m" x="50" y="350" font-size="22" fill="#4dd0ff" clip-path="url(#t1)">&gt; Shipping React, Spring Boot &amp; Android projects</text>
<clipPath id="t2"><rect x="50" y="326" height="34" width="0"><animate attributeName="width" values="0;500;500;0" keyTimes="0;.133;.3;.333" dur="12s" begin="11s" repeatCount="indefinite"/></rect></clipPath>
<text class="m" x="50" y="350" font-size="22" fill="#4dd0ff" clip-path="url(#t2)">&gt; Trying out new things...</text>
<rect x="50" y="330" width="11" height="26" fill="#f5c518"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

<g filter="url(#glow)">
<g class="rot3"><circle cx="1050" cy="225" r="150" fill="none" stroke="#f5c518" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 12"/></g>
<g class="rot2"><circle cx="1050" cy="225" r="118" fill="none" stroke="#e62429" stroke-opacity=".8" stroke-width="3" stroke-dasharray="60 20 6 20"/></g>
<g class="rot1"><circle cx="1050" cy="225" r="84" fill="none" stroke="#4dd0ff" stroke-width="12" stroke-opacity=".75" stroke-dasharray="26 11"/></g>
<circle cx="1050" cy="225" r="60" fill="none" stroke="#4dd0ff" stroke-opacity=".6" stroke-width="2"/>
<circle cx="1050" cy="225" r="30" fill="url(#core)"><animate attributeName="r" values="26;34;26" dur="2.6s" repeatCount="indefinite"/></circle>
</g>

<rect x="50" y="396" width="1180" height="1" fill="#f5c518" opacity=".25"/>
<text class="m" x="50" y="420" font-size="12" fill="#94a3b8" letter-spacing="2">SYS ONLINE · ALL MODULES NOMINAL · READY FOR NEW MISSIONS</text>
<rect x="50" y="396" width="120" height="2" fill="#e62429"><animate attributeName="x" values="50;1110;50" dur="7s" repeatCount="indefinite"/></rect>

<g fill="none" stroke="#f5c518" stroke-width="2" opacity=".8"><path d="M14 40V14h26"/><path d="M1240 14h26v26"/><path d="M14 400v26h26"/><path d="M1240 426h26v-26"/></g>
</g>
<rect x=".5" y=".5" width="1279" height="439" rx="20" fill="none" stroke="#f5c518" stroke-opacity=".2"/>
</svg>
