<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Apex Arcade — 50-game browser arcade built with React and TypeScript">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A13"/><stop offset=".55" stop-color="#0A1120"/><stop offset="1" stop-color="#060A13"/></linearGradient>
<linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#FFB4B4"/><stop offset=".7" stop-color="#FF6B6B"/><stop offset="1" stop-color="#1E2C48"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2C48" stop-opacity=".20"/><stop offset="1" stop-color="#6C9FE0" stop-opacity=".04"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#F5F8FC" stop-opacity="0"/><stop offset=".5" stop-color="#F5F8FC" stop-opacity=".35"/><stop offset="1" stop-color="#F5F8FC" stop-opacity="0"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB4B4" stop-opacity="0"/><stop offset=".5" stop-color="#FFB4B4" stop-opacity=".20"/><stop offset="1" stop-color="#FFB4B4" stop-opacity="0"/></linearGradient>
<radialGradient id="bloom"><stop offset="0" stop-color="#FF6B6B" stop-opacity=".22"/><stop offset="1" stop-color="#FF6B6B" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#1E2C48" stroke-opacity=".18"/></pattern>
<clipPath id="win"><rect width="400" height="320" rx="18"/></clipPath>
<clipPath id="prev"><rect x="22" y="58" width="356" height="104" rx="10"/></clipPath>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.s{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.p2{animation-delay:.8s}.p3{animation-delay:1.6s}
.arrow{animation:arrow 2.2s ease-in-out infinite}
@keyframes arrow{50%{transform:translateX(5px)}}
.orbs{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shinex{animation:shinex var(--sd,4.6s) linear infinite}
@keyframes shinex{from{transform:translateX(0)}to{transform:translateX(520px)}}
.scany{animation:scany var(--sy,5.5s) ease-in-out infinite}
@keyframes scany{0%,100%{transform:translateY(0)}50%{transform:translateY(88px)}}
@media (prefers-reduced-motion:reduce){.pulse,.arrow,.orbs,.shinex,.scany{animation:none!important}}
</style>
</defs>
<g clip-path="url(#win)">
<rect width="400" height="320" fill="url(#bg)"/>
<rect width="400" height="320" fill="url(#grid)"/>
<ellipse cx="330" cy="80" rx="220" ry="150" fill="url(#bloom)"/>

<rect width="400" height="42" fill="url(#head)"/>
<g fill="none" stroke="#F5F8FC" stroke-width="1" stroke-opacity=".16">
<path d="M400 0L356 46M400 0L338 34M400 0L336 20M400 0L352 6"/>
<path d="M400 14A14 14 0 0 1 386 0M400 26A26 26 0 0 1 374 0M400 38A38 38 0 0 1 362 0M400 50A50 50 0 0 1 350 0"/>
</g>
<text class="s" x="20" y="28" font-size="20" font-weight="800" fill="#0B1424">Apex Arcade</text>
<text class="m" x="382" y="27" text-anchor="end" font-size="9" fill="#F5F8FC" fill-opacity=".8">node 01 · web</text>
<rect class="shinex" style="--sd:4.6s" x="-120" y="0" width="120" height="42" fill="url(#shine)" opacity=".5"/>

<circle cx="5" cy="160" r="4.5" fill="#FFC857" filter="url(#glow)"/>
<circle cx="395" cy="160" r="4.5" fill="#FFC857" filter="url(#glow)"/>
<path d="M9 160h9M391 160h-9" stroke="#FFC857" stroke-width="1.5" opacity=".8"/>

<rect x="22" y="58" width="356" height="104" rx="10" fill="#080E1A" stroke="#1E2C48" stroke-opacity=".7"/>
<g clip-path="url(#prev)">
<text class="m" x="36" y="78" font-size="9" letter-spacing="1.6" fill="#8FA1B6">ARCADE · 50 GAMES</text>
<text class="m" x="364" y="78" text-anchor="end" font-size="9" fill="#FFB4B4">SAMPLE SCORE 1,240</text>
<g>
<rect x="36" y="86" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
<rect x="118" y="86" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
<rect x="200" y="86" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
<rect x="282" y="86" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
<rect x="36" y="122" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
<rect x="118" y="122" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
<rect x="200" y="122" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
<rect x="282" y="122" width="72" height="30" rx="6" fill="#0B1424" stroke="#1E2C48" stroke-opacity=".7"/>
</g>
<g fill="none" stroke-width="2" stroke-linecap="round">
<path d="M62 94l16 14M78 94L62 108" stroke="#FFB4B4"/>
<circle cx="154" cy="101" r="7" stroke="#6C9FE0"/>
<path d="M236 108l-9-14 18 2z" stroke="#D9232E" stroke-linejoin="round"/>
<rect x="316" y="94" width="14" height="14" rx="2" transform="rotate(45 323 101)" stroke="#FF6B6B"/>
<path d="M52 137h8M60 130v14M70 130v14" stroke="#6C9FE0"/>
<circle cx="146" cy="137" r="2.5" fill="#FFB4B4" stroke="none"/><circle cx="158" cy="137" r="2.5" fill="#FFB4B4" stroke="none"/><circle cx="170" cy="137" r="2.5" fill="#FFB4B4" stroke="none"/>
<path d="M210 137h14M217 130l7 7-7 7" stroke="#D9232E"/>
<path d="M296 144l7-9 7 5 7-10 7 14" stroke="#FF6B6B"/>
</g>
<rect class="pulse" x="36" y="86" width="72" height="30" rx="6" fill="#FFB4B4" fill-opacity=".08"/>
<rect class="pulse p2" x="200" y="122" width="72" height="30" rx="6" fill="#6C9FE0" fill-opacity=".08"/>
<rect class="scany" style="--sy:5.5s" x="0" y="58" width="400" height="16" fill="url(#scan)"/>
</g>

<text class="s" x="22" y="190" font-size="15" fill="#CAD5E1">React launcher for 50 browser games</text>
<text class="s" x="22" y="211" font-size="15" fill="#CAD5E1">with history, favorites and score cards.</text>

<g class="s" font-size="12.5" fill="#F5F8FC">
<rect x="22" y="230" width="58" height="26" rx="13" fill="#FFB4B4" fill-opacity=".10" stroke="#FF6B6B"/>
<text x="51" y="247" text-anchor="middle">React</text>
<rect x="88" y="230" width="92" height="26" rx="13" fill="#FFB4B4" fill-opacity=".10" stroke="#FF6B6B"/>
<text x="134" y="247" text-anchor="middle">TypeScript</text>
<rect x="188" y="230" width="51" height="26" rx="13" fill="#FFB4B4" fill-opacity=".10" stroke="#FF6B6B"/>
<text x="213.5" y="247" text-anchor="middle">Vite</text>
<rect x="247" y="230" width="44" height="26" rx="13" fill="#FFB4B4" fill-opacity=".10" stroke="#FF6B6B"/>
<text x="269" y="247" text-anchor="middle">PWA</text>
</g>

<rect x="22" y="270" width="356" height="34" rx="17" fill="#FFB4B4" fill-opacity=".12" stroke="#FFB4B4" stroke-opacity=".55"/>
<rect x="22" y="270" width="34" height="34" rx="17" fill="#FFB4B4" fill-opacity=".18"/>
<path d="M34 283h8l3 3h7v9H34z" fill="none" stroke="#FFB4B4" stroke-width="1.5"/>
<text class="s" x="68" y="292" font-size="13" font-weight="700" letter-spacing=".6" fill="#FFB4B4">open repository</text>
<g class="arrow"><path d="M346 287h12M352 282l5 5-5 5" fill="none" stroke="#FFB4B4" stroke-width="1.8" stroke-linecap="round"/></g>
</g>
<rect x=".5" y=".5" width="399" height="319" rx="18" fill="none" stroke="#1E2C48" stroke-opacity=".45"/>
</svg>
