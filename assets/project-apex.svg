<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="Apex Arcade — React arcade launcher with 50 games">
<defs><clipPath id="c"><rect width="400" height="270" rx="16"/></clipPath>
<filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}.s{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}.r{transform-origin:350px 62px;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.r{animation:none}}</style></defs>
<g clip-path="url(#c)">
<rect width="400" height="270" fill="#0b0e14"/>
<rect width="400" height="2" fill="#e62429" opacity=".35"><animate attributeName="y" values="0;270" dur="4.5s" repeatCount="indefinite"/></rect>
<g class="r" filter="url(#g)"><circle cx="350" cy="62" r="26" fill="none" stroke="#e62429" stroke-width="5" stroke-dasharray="12 7"/></g>
<circle cx="350" cy="62" r="9" fill="#e62429"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text class="m" x="26" y="42" font-size="12" fill="#e62429" letter-spacing="3">SCHEMATIC 01</text>
<text class="s" x="26" y="88" font-size="34" font-weight="800" fill="#f1f5f9">Apex Arcade</text>
<text class="m" x="26" y="114" font-size="13" fill="#f5c518">50-game browser arcade</text>
<text class="s" x="26" y="146" font-size="14" fill="#94a3b8">React launcher with a playable theatre,</text>
<text class="s" x="26" y="166" font-size="14" fill="#94a3b8">history, favorites and shareable score cards</text>
<text class="m" x="26" y="204" font-size="12" fill="#cbd5e1">React · TypeScript · Vite · Canvas · PWA</text>
<rect x="26" y="222" width="348" height="1" fill="#e62429" opacity=".35"/>
<text class="m" x="26" y="246" font-size="12" fill="#e62429" letter-spacing="2">▶ OPEN REPO</text>
<g fill="none" stroke="#e62429" stroke-width="2"><path d="M8 24V8h16"/><path d="M376 8h16v16"/><path d="M8 246v16h16"/><path d="M376 262h16v-16"/></g>
</g>
<rect x=".5" y=".5" width="399" height="269" rx="16" fill="none" stroke="#e62429" stroke-opacity=".4"/>
</svg>
