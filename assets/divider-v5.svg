<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 36" aria-hidden="true">
<defs>
<linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#1E2C48" stop-opacity="0"/><stop offset=".25" stop-color="#1E2C48" stop-opacity=".55"/><stop offset=".5" stop-color="#D9232E" stop-opacity=".7"/><stop offset=".75" stop-color="#1E2C48" stop-opacity=".55"/><stop offset="1" stop-color="#1E2C48" stop-opacity="0"/></linearGradient>
<linearGradient id="pulse" x1="0" x2="1"><stop offset="0" stop-color="#6C9FE0" stop-opacity="0"/><stop offset=".5" stop-color="#6C9FE0"/><stop offset="1" stop-color="#6C9FE0" stop-opacity="0"/></linearGradient>
<linearGradient id="pulse2" x1="0" x2="1"><stop offset="0" stop-color="#FFB4B4" stop-opacity="0"/><stop offset=".5" stop-color="#FFB4B4"/><stop offset="1" stop-color="#FFB4B4" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-100%" y="-400%" width="300%" height="900%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.p{animation:p 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.p2{animation-delay:.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}
@keyframes p{50%{opacity:.25}}
.pulseA{animation:pulseA 5.5s linear infinite}
@keyframes pulseA{from{transform:translateX(0)}to{transform:translateX(1500px)}}
.pulseB{animation:pulseB 7.5s linear infinite}
@keyframes pulseB{from{transform:translateX(1280px)}to{transform:translateX(-180px)}}
@media (prefers-reduced-motion:reduce){.p,.pulseA,.pulseB{animation:none!important}}
</style>
</defs>
<rect y="17" width="1280" height="2" fill="url(#rail)"/>

<g fill="#1E2C48">
<rect x="120" y="14" width="1" height="8"/><rect x="320" y="14" width="1" height="8"/><rect x="520" y="14" width="1" height="8"/>
<rect x="760" y="14" width="1" height="8"/><rect x="960" y="14" width="1" height="8"/><rect x="1160" y="14" width="1" height="8"/>
</g>
<g>
<circle class="p" cx="120" cy="18" r="2.4" fill="#6C9FE0"/>
<circle class="p p2" cx="320" cy="18" r="2" fill="#FF6B6B"/>
<circle class="p p3" cx="520" cy="18" r="2.4" fill="#6C9FE0"/>
<circle class="p p4" cx="760" cy="18" r="2" fill="#FFB4B4"/>
<circle class="p p2" cx="960" cy="18" r="2.4" fill="#6C9FE0"/>
<circle class="p p3" cx="1160" cy="18" r="2" fill="#FF6B6B"/>
</g>

<rect class="pulseA" x="-220" y="16" width="220" height="4" rx="2" fill="url(#pulse)" opacity=".9"/>
<rect class="pulseB" x="0" y="16" width="180" height="4" rx="2" fill="url(#pulse2)" opacity=".75"/>

<g transform="translate(640 18)">
<g fill="none" stroke="#6C9FE0" stroke-opacity=".28" stroke-width="1">
<path d="M-52 0A52 52 0 0 1 -37 -37M52 0A52 52 0 0 0 37 -37"/>
<path d="M-30 0A30 30 0 0 1 -21 -21M30 0A30 30 0 0 0 21 -21"/>
<path d="M-52 0H-34M34 0H52"/>
</g>
<path d="M-34 0H-12M12 0H34" stroke="#D9232E" stroke-opacity=".55" stroke-width="1.4"/>
<g fill="none" stroke="#F5F8FC" stroke-opacity=".62" stroke-width="1" stroke-linecap="round">
<path d="M-3 -3C-8 -7 -12 -9 -16 -13M-4 -1C-9 -2 -13 -2 -18 -4M-4 2C-9 2 -13 4 -17 7M-3 4C-7 7 -9 10 -11 14"/>
<path d="M3 -3C8 -7 12 -9 16 -13M4 -1C9 -2 13 -2 18 -4M4 2C9 2 13 4 17 7M3 4C7 7 9 10 11 14"/>
</g>
<ellipse cx="0" cy="2" rx="3.6" ry="5" fill="#D9232E" stroke="#060A13" stroke-width=".9"/>
<circle cx="0" cy="-4" r="2.5" fill="#D9232E" stroke="#060A13" stroke-width=".9"/>
<circle cx="-1" cy="-4.6" r=".65" fill="#FFC857"/>
<circle cx="1" cy="-4.6" r=".65" fill="#FFC857"/>
</g>
</svg>
