name: Refresh dashboard

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render live assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          python scripts/render_telemetry.py
          python scripts/render_repos.py
          python scripts/render_activity.py

      - name: Commit changed assets
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg assets/repos.svg assets/activity.svg
          if git diff --cached --quiet; then
            echo "dashboard already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh live dashboard"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # pushes made with GITHUB_TOKEN do not trigger other workflows
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

