name: Activity log

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update README activity block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          user = os.environ["USER_NAME"]
          req = urllib.request.Request(
              f"https://api.github.com/users/{user}/events/public?per_page=50",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
          )
          events = json.load(urllib.request.urlopen(req))

          lines = []
          for e in events:
              t, repo, p = e["type"], e["repo"]["name"], e["payload"]
              day = e["created_at"][:10]
              if t == "PushEvent":
                  n = p.get("size") or len(p.get("commits", []))
                  text = f"pushed {n} commit(s) to"
              elif t == "CreateEvent":
                  text = f"created {p.get('ref_type')} in"
              elif t == "PullRequestEvent":
                  text = f"{p.get('action')} a pull request in"
              elif t == "IssuesEvent":
                  text = f"{p.get('action')} an issue in"
              elif t == "WatchEvent":
                  text = "starred"
              elif t == "ForkEvent":
                  text = "forked"
              else:
                  continue
              lines.append(f"{day}  {text} {repo}")
              if len(lines) == 6:
                  break

          body = "\n".join(lines) if lines else "no recent public activity"
          fence = "`" * 3
          block = f"<!--START_ACTIVITY-->\n{fence}text\n{body}\n{fence}\n<!--END_ACTIVITY-->"

          text = open("README.md", encoding="utf-8").read()
          text = re.sub(r"<!--START_ACTIVITY-->.*?<!--END_ACTIVITY-->",
                        lambda m: block, text, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update activity log" && git push)
